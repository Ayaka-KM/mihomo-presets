# OpenClash 官方覆写模块：DDNS
# 来源：https://github.com/vernesong/OpenClash/blob/dev/luci-app-openclash/root/etc/openclash/overwrite/DDNS
# 说明：Keep DDNS IP-detection endpoints and DNS provider APIs off the proxy so records never get a proxy exit IP
# 原注释：
#   Use exact endpoint hosts only; widening to provider root domains sends whole websites direct.
#   DDNS_DOMAIN excludes your own DDNS hostname from Fake-IP so LAN clients can reach the router by name.
# 合并方式（原模块用 OpenClash 的覆写操作符，这里已展开成普通配置）：
#   rules：放到你已有列表的最前面（原写法 +rules）
#   dns.fake-ip-filter：追加到你已有列表的末尾（原写法 fake-ip-filter+）
# 占位符 DDNS_DOMAIN 已替换为默认值 example.invalid，按需改成你自己的值
# 插件设置（[General]，是 OpenClash 自身的开关，裸核里没有，仅供参考）：
#   WAN_AC_BLACK_PORTS = 3478,5349
# 由 mihomo-presets 工作流自动生成，请勿手改；按需取舍请改仓库默认分支上的 config.yaml

rules:
- DOMAIN,4.ipw.cn,DIRECT
