# OpenClash 预设：上游 DNS（覆写设置 → DNS →「自定义上游 DNS 服务器」默认勾选的那组）
# 来源：https://github.com/vernesong/OpenClash/blob/dev/luci-app-openclash/root/etc/config/openclash（dns_servers 段）
# 来源：https://github.com/vernesong/OpenClash/blob/dev/luci-app-openclash/root/usr/share/openclash/yml_change.sh（兜底逻辑）
# OpenClash 只在开启「自定义上游 DNS 服务器」时才用这组替换配置里的 DNS；其余内置备选和兜底逻辑列在文末
# 由 mihomo-presets 工作流自动生成，请勿手改；按需取舍请改仓库默认分支上的 config.yaml

dns:
  default-nameserver:
  - 114.114.114.114
  - 119.29.29.29
  - 223.5.5.5
  nameserver:
  - 114.114.114.114
  - 119.29.29.29
  - https://doh.pub/dns-query
  - https://dns.alidns.com/dns-query
  fallback:
  - https://dns.google/dns-query
  - https://dns.cloudflare.com/dns-query

# 内置备选（默认未启用）：
