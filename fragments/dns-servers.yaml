#
# OpenClash 的兜底逻辑（yml_change.sh）：
#   nameserver 为空时补上：114.114.114.114, 119.29.29.29, 8.8.8.8, 1.1.1.1
#     同时 fallback 为空时补上：https://dns.cloudflare.com/dns-query, https://dns.google/dns-query
#   default-nameserver 写了但为空时补上：114.114.114.114, 119.29.29.29, 8.8.8.8, 1.1.1.1
#   开启 respect-rules，或 nameserver 全部走代理时，自动设置 proxy-server-nameserver
#     （避免节点域名解析回环）为：114.114.114.114, 119.29.29.29, 8.8.8.8, 1.1.1.1
#   Dnsmasq 转发模式下删掉 system 上游（会造成 DNS 回环）
