name: Sync presets

# 每天从 OpenClash 官方仓库提取预设（Fake-IP 过滤、本地网段、DNS、嗅探等），
# 生成裸 mihomo 可用的规则集和配置片段，用官方 mihomo 内核校验后发布到 dist 分支。
# 说明见 README.md。

on:
  schedule:
    # 北京时间每天 03:23
    - cron: "23 19 * * *"
  workflow_dispatch:
    inputs:
      publish:
        description: "有变化时发布到 dist 分支"
        type: boolean
        default: true
  push:
    branches:
      - main
    paths:
      - "config.yaml"
      - "extract.py"
      - "validate.py"
      - ".github/workflows/sync.yml"

permissions:
  contents: write

concurrency:
  group: sync-presets
  cancel-in-progress: false

env:
  PRESETS_BRANCH: dist

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          path: self

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check --quiet "pyyaml==6.0.2"

      - name: Read settings
        id: settings
        run: python self/extract.py settings --config self/config.yaml >> "$GITHUB_OUTPUT"

      - name: Fetch upstream OpenClash
        env:
          UPSTREAM_REPOSITORY: ${{ steps.settings.outputs.upstream_repository }}
          UPSTREAM_REF: ${{ steps.settings.outputs.upstream_ref }}
        run: |
          # blobless clone: full history for the change log, file contents only for the preset sources
          git clone --quiet --filter=blob:none --no-checkout --branch "$UPSTREAM_REF" \
            "https://github.com/$UPSTREAM_REPOSITORY.git" upstream
          python self/extract.py paths | git -C upstream sparse-checkout set --no-cone --stdin
          git -C upstream checkout --quiet "$UPSTREAM_REF"

      - name: Checkout published presets
        working-directory: self
        run: |
          if git ls-remote --exit-code --heads origin "$PRESETS_BRANCH" > /dev/null; then
            git fetch --quiet --depth=1 origin "+refs/heads/$PRESETS_BRANCH:refs/remotes/origin/$PRESETS_BRANCH"
            git worktree add --quiet -B "$PRESETS_BRANCH" ../published "origin/$PRESETS_BRANCH"
          else
            git worktree add --quiet --detach ../published
            git -C ../published switch --quiet --orphan "$PRESETS_BRANCH"
          fi

      - name: Build presets
        id: build
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch || github.ref_name }}
        run: |
          python self/extract.py build \
            --config self/config.yaml \
            --upstream upstream \
            --previous published \
            --out out \
            --report report.md \
            --commit-message commit-message.txt \
            --publish-repo "$GITHUB_REPOSITORY" \
            --publish-branch "$PRESETS_BRANCH" \
            --default-branch "$DEFAULT_BRANCH"
          cat report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Decide
        id: decide
        env:
          CHANGED: ${{ steps.build.outputs.changed }}
          EVENT: ${{ github.event_name }}
          PUBLISH_INPUT: ${{ inputs.publish }}
        run: |
          validate=false
          publish=false
          if [ "$CHANGED" = true ] || [ "$EVENT" = workflow_dispatch ]; then
            validate=true
          fi
          if [ "$CHANGED" = true ] && { [ "$EVENT" != workflow_dispatch ] || [ "$PUBLISH_INPUT" = true ]; }; then
            publish=true
          fi
          echo "validate=$validate" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"

      - name: Download mihomo
        if: steps.decide.outputs.validate == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          MIHOMO_REPOSITORY: ${{ steps.settings.outputs.validator_repository }}
          MIHOMO_RELEASE: ${{ steps.settings.outputs.validator_release }}
        run: |
          tag="$MIHOMO_RELEASE"
          if [ "$tag" = latest ]; then
            tag=$(gh release view --repo "$MIHOMO_REPOSITORY" --json tagName --jq .tagName)
          fi
          # amd64-v1 runs on every x86-64 CPU; the asset name carries the release tag
          asset="mihomo-linux-amd64-v1-$tag.gz"
          gh release download "$tag" --repo "$MIHOMO_REPOSITORY" --pattern "$asset" --dir "$RUNNER_TEMP"
          gunzip -c "$RUNNER_TEMP/$asset" > "$RUNNER_TEMP/mihomo"
          chmod +x "$RUNNER_TEMP/mihomo"
          "$RUNNER_TEMP/mihomo" -v

      - name: Validate presets with mihomo
        if: steps.decide.outputs.validate == 'true'
        run: |
          status=0
          python self/validate.py \
            --mihomo "$RUNNER_TEMP/mihomo" \
            --out out \
            --mmdb upstream/luci-app-openclash/root/etc/openclash/Country.mmdb \
            --report validate.md || status=$?
          cat validate.md >> "$GITHUB_STEP_SUMMARY" 2> /dev/null || true
          exit "$status"

      - name: Publish
        if: steps.decide.outputs.publish == 'true'
        working-directory: published
        run: |
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a ../out/. ./
          git add -A
          git -c user.name="github-actions[bot]" \
            -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit --quiet -F ../commit-message.txt
          git push --quiet origin "HEAD:refs/heads/$PRESETS_BRANCH"
          echo "已发布到 [\`$PRESETS_BRANCH\`]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/tree/$PRESETS_BRANCH)" >> "$GITHUB_STEP_SUMMARY"
